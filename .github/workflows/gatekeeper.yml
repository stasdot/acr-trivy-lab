name: Security Gatekeeper Pipeline

on:
  push:
    branches:
      - vulnerable
  workflow_dispatch:

jobs:
  build-scan-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # 2. Build image locally (NO registry name yet)
      - name: Build Docker image (local)
        run: |
          docker build -t vulnerable-app:${{ github.run_number }} .

      # 3. Security Gatekeeper – Trivy scan
      - name: Run Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: vulnerable-app:${{ github.run_number }}
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true

      # 4. Login to Azure Container Registry (only if scan passed)
      - name: Login to ACR
        if: success()
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.ACR_LINK }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}

      # 5. Tag and push image to ACR
      - name: Push image to ACR
        if: success()
        run: |
          docker tag vulnerable-app:${{ github.run_number }} \
            ${{ secrets.ACR_LINK }}/vulnerable-app:${{ github.run_number }}
          docker push ${{ secrets.ACR_LINK }}/vulnerable-app:${{ github.run_number }}
          echo "image pushed successfully"
